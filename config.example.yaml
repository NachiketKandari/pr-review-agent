name: Local Config
version: 1.0.0
schema: v1
models:
  - name: DeepSeek V4 Flash
    provider: deepseek
    model: deepseek-v4-flash
    apiBase: https://api.deepseek.com/v1
    apiKey: sk-your-key

# Optional: review-mode settings. All keys are optional; omitted ones use
# the built-in defaults (see README).
review:
  model: deepseek-v4-flash     # optional override; else -model flag, else first model
  systemPrompt: |
    You are a senior code reviewer. Focus on correctness, security,
    concurrency, performance, and maintainability.
  # chunkPrompt supports {{index}} {{total}} {{files}} {{functions}} {{diff}} {{responseTokens}}
  chunkPrompt: ""
  # filePrompt weaves one file's chunk findings into a single file review.
  # Supports {{file}} {{findings}}.
  filePrompt: ""
  # mergePrompt supports {{findings}}
  mergePrompt: ""
  # Budgets tuned for a 16K-context model: ~10K input + 4K response + ~2K
  # headroom for the system prompt and PR intent context.
  maxChunkTokens: 10000
  maxResponseTokens: 4000
  temperature: 0.2

# Optional: explain-mode settings (-explain), for writing a rich interactive
# HTML page explaining a change instead of reviewing it. Entirely separate
# from review above: no prompt or budget is shared, so enabling -explain never
# changes a review run. All keys optional; omitted ones use built-in defaults.
explain:
  # model: optional; else the -model flag, then review.model, then the first model
  systemPrompt: ""
  # chunkPrompt handles one diff chunk. Supports
  # {{index}} {{total}} {{files}} {{functions}} {{diff}} {{context}} {{responseTokens}}
  chunkPrompt: ""
  # mergePrompt weaves one section's fragments into continuous prose.
  # Supports {{section}} {{fragments}} {{responseTokens}}.
  mergePrompt: ""
  # quizPrompt writes the closing questions. Supports {{page}} {{count}} {{responseTokens}}.
  quizPrompt: ""
  # titlePrompt proposes the page headline. Supports {{intent}} {{files}}.
  titlePrompt: ""
  # Budgets for a 16K-context model: ~7K input + 3K JSON reply, leaving room
  # for the system prompt, the PR intent, and the pre-image source context.
  maxChunkTokens: 7000
  maxResponseTokens: 3000
  maxQuizTokens: 2000
  temperature: 0.4        # prose, not analysis
  # How much of the surrounding code to read from your local clone before
  # explaining: the pre-image of the changed files, so the background section
  # is grounded rather than guessed. Ignored when no clone is available, in
  # which case the model is told to describe only what the diff shows.
  sourceMaxFiles: 6
  sourceMaxTokens: 3000

# Optional: GitHub access for review mode.
# Branch review ("source" "target" or "target" for the current branch) never
# needs a token: it runs git in your terminal, so it authenticates as you
# (SSH key / credential manager). A token is only a fallback for PR-URL
# review when no local clone is available.
# token: API token (config > GITHUB_TOKEN env > gh CLI account > git credentials).
# diffToken: the ?token= value GitHub puts on shareable .patch/.diff links
# of private PRs; lets the tool download the PR patch without an API token
# (useful when the org blocks tokens with private repo access).
github:
  token: ""
  diffToken: ""
